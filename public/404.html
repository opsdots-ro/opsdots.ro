<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — OpsDots</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0B2532;color:#fff;text-align:center;padding:24px}
code{font-family:ui-monospace,monospace;color:#5FD0EE;font-size:1.05rem}
h1{font-size:clamp(1.8rem,5vw,3rem);margin:16px 0 6px}
p{color:#A9C2CC;margin:0}
.links{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{background:#0098C3;color:#fff;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none}
a.alt{background:transparent;border:2px solid #0098C3}
</style>
</head>
<body>
<main>
  <code>$ opsdotsctl get page → Error: NotFound (404)</code>
  <h1>Pagina nu a fost găsită.</h1>
  <p lang="en">Page not found.</p>
  <div class="links">
    <a href="/">Pagina principală →</a>
    <a href="/en/" class="alt" lang="en">English homepage →</a>
  </div>
</main>
</body>
</html>
